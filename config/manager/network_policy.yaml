apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-ports
  namespace: default
spec:
  podSelector: {}
  egress:
    - to:
        - ipBlock:
            cidr: 159.60.128.0/24  # CIDR of Sealight server Endpoint.
      ports:
        - port: 443
          protocol: TCP
        - port: 80-88
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 123 
          protocol: UDP
        - port: 53 
          protocol: UDP
  policyTypes:
    - Egress
